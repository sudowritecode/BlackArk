# .slsa-goreleaser/linux-arm64.yml
version: 1
env:
  - GO_VERSION=1.23
  - GOOS=linux
  - GOARCH=arm64
  - CGO_ENABLED=0
goos: linux
goarch: arm64
binary: blackark
flags:
  - -trimpath
  - -ldflags=-X main.version={{ .Env.VERSION }} -X main.commit={{ .Env.COMMIT }} -X main.commitDate={{ .Env.COMMIT_DATE }} -X main.treeState={{ .Env.TREE_STATE }}
  - -tags=netgo
  - -v
main: ./cmd/blackark
