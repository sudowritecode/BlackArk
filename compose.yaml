services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: blackark
      POSTGRES_PASSWORD: blackark
      POSTGRES_DB: blackark
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackark"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports: ["${BLACKARK_POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  control:
    build: .
    environment:
      BLACKARK_DATABASE_URL: postgres://blackark:blackark@postgres:5432/blackark?sslmode=disable
      BLACKARK_API_TOKEN: ${BLACKARK_API_TOKEN:-local-development-token}
      BLACKARK_LISTEN_ADDR: :8080
      BLACKARK_DASHBOARD_ENABLED: ${BLACKARK_DASHBOARD_ENABLED:-true}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["${BLACKARK_CONTROL_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build: .
    user: "0:0"
    entrypoint: ["/usr/local/bin/blackark-agent"]
    environment:
      BLACKARK_CONTROL_URL: http://control:8080
      BLACKARK_JOIN_TOKEN: ${BLACKARK_JOIN_TOKEN:-}
      BLACKARK_NODE_NAME: ${BLACKARK_NODE_NAME:-worker-1}
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    depends_on:
      control: {condition: service_healthy}
    profiles: ["worker"]
volumes:
  postgres-data:
